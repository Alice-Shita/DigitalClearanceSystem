<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZASTI | Staff Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f2937;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: #166534;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 22px rgba(22, 101, 52, 0.20);
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            color: #14532d;
        }

        .brand p {
            margin: 7px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.10);
            border: 1px solid #e5e7eb;
        }

        .card-title {
            text-align: center;
            margin-bottom: 26px;
        }

        .card-title h2 {
            margin: 0;
            font-size: 21px;
            color: #111827;
        }

        .card-title p {
            margin: 7px 0 0;
            font-size: 13px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 14px 0 43px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.10);
        }

        .login-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #166534;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #14532d;
        }

        .login-button i {
            margin-right: 8px;
        }

        .staff-note {
            margin-top: 20px;
            padding: 13px;
            background: #f0fdf4;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            color: #166534;
        }

        .staff-note i {
            margin-right: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 11px 13px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-user-tie"></i>
        </div>

        <h1>ZASTI</h1>
        <p>Digital Student Clearance System</p>
    </div>

    <div class="card">

        <div class="card-title">
            <h2>Staff Portal</h2>
            <p>Authorized Staff Access</p>
        </div>

        {% if error %}
        <div class="error">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="username">Staff Username</label>

                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your staff username"
                        required
                        autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="login-button">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>

        </form>

        <div class="staff-note">
            <i class="fa-solid fa-shield-halved"></i>
            Authorized ZASTI staff access only.
        </div>

    </div>

    <div class="footer">
        Zambia Air Services Training Institute<br>
        Digital Student Clearance System<br>
        © 2026 Zambia Air Services Training Institute<br>
        All Rights Reserved
    </div>

</div>

</body>
</html>
