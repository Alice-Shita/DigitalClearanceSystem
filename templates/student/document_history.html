<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Document History</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: #1e293b;
}

.history-wrapper {
    max-width: 850px;
    margin: 40px auto;
    padding: 0 18px 40px;
}

.history-header {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 3px 14px rgba(0,0,0,.06);
}

.history-header h1 {
    margin: 0 0 8px;
    color: #166534;
    font-size: 28px;
}

.history-header p {
    margin: 0;
    color: #64748b;
    font-size: 14px;
}

.document-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.document-button {
    width: 100%;
    min-height: 64px;

    display: flex;
    align-items: center;

    padding: 16px 20px;

    background: white;
    color: #1e293b;

    border: 1px solid #e2e8f0;
    border-radius: 13px;

    text-decoration: none;

    font-size: 16px;
    font-weight: 700;

    box-shadow: 0 2px 8px rgba(0,0,0,.04);

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .15s ease;
}

.document-button:hover {
    background: #f0fdf4;
    border-color: #86efac;
}

.document-button:active {
    transform: scale(.99);
}

.button-icon {
    width: 40px;
    height: 40px;
    min-width: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 14px;

    border-radius: 10px;

    background: #eff6ff;
    color: #2563eb;
}

.button-icon svg {
    width: 21px;
    height: 21px;
}

.button-text {
    flex: 1;
}

.button-arrow {
    color: #94a3b8;
    font-size: 20px;
}

.back-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    margin-top: 22px;

    padding: 11px 17px;

    background: white;
    color: #2563eb;

    border: 1px solid #bfdbfe;
    border-radius: 10px;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;
}

.back-button:hover {
    background: #eff6ff;
}

.footer {
    text-align: center;

    margin-top: 35px;
    padding-top: 22px;

    border-top: 1px solid #e2e8f0;

    color: #64748b;
    font-size: 13px;
}

@media (max-width: 600px) {

    .history-wrapper {
        margin: 20px auto;
        padding: 0 12px 30px;
    }

    .history-header {
        padding: 20px;
    }

    .history-header h1 {
        font-size: 23px;
    }

    .document-button {
        min-height: 60px;
        padding: 14px 15px;
        font-size: 14px;
    }

    .button-icon {
        width: 37px;
        height: 37px;
        min-width: 37px;
    }

}

</style>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
    @media print {
        .site-header,
        .student-sidebar,
        .student-menu-button,
        .student-menu-overlay {
            display: none !important;
        }
        body {
            padding-top: 0 !important;
        }
        .student-portal-layout,
        .student-portal-content {
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }
    }
    </style>

</head>

<body>

{% include "components/student_header.html" %}
<div class="student-portal-layout">
    {% include "components/sidebar.html" %}
    <main class="student-portal-content">


<div class="history-wrapper">

    <div class="history-header">

        <h1>Document History</h1>

        <p>
            Select the type of documents you want to view.
        </p>

    </div>


    <div class="document-buttons">


        <!-- =================================================
             1. CLEARANCE FORMS
             ================================================= -->

        <a
            href="{{ url_for('student_clearance_forms') }}"
            class="document-button"
        >

            <span class="button-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M6 2h9l4 4v16H6z"/>

                    <path d="M14 2v5h5"/>

                    <path d="M9 13h6"/>

                    <path d="M9 17h6"/>

                </svg>

            </span>

            <span class="button-text">
                Clearance Forms
            </span>

            <span class="button-arrow">
                ›
            </span>

        </a>


        <!-- =================================================
             2. ACCOUNTS DOCUMENTS
             ================================================= -->

        <a
            href="{{ url_for('student_accounts_documents') }}"
            class="document-button"
        >

            <span class="button-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    />

                    <path d="M3 10h18"/>

                    <path d="M7 15h3"/>

                </svg>

            </span>

            <span class="button-text">
                Accounts Documents
            </span>

            <span class="button-arrow">
                ›
            </span>

        </a>


        <!-- =================================================
             3. OTHER DOCUMENTS
             ================================================= -->

        <a
            href="{{ url_for('student_other_documents') }}"
            class="document-button"
        >

            <span class="button-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M4 4h16v16H4z"/>

                    <path d="M8 8h8"/>

                    <path d="M8 12h8"/>

                    <path d="M8 16h5"/>

                </svg>

            </span>

            <span class="button-text">
                Other Documents
            </span>

            <span class="button-arrow">
                ›
            </span>

        </a>


    </div>


    


    <div class="footer">

        © 2026 Zambia Air Services Training Institute

        <br>

        All Rights Reserved

    </div>

</div>


    </main>
</div>
</body>

</html>
