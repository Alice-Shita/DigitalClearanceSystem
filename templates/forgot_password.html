<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | ZASTI Digital Clearance</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;padding:24px;background:#f3f5f8;font-family:Arial,sans-serif;color:#202938}
        .panel{max-width:440px;margin:45px auto;background:white;padding:28px;border-radius:12px;box-shadow:0 5px 24px #00000012}
        h2{margin-top:0;color:#176b45}
        p{line-height:1.5;color:#596579}
        label{display:block;margin:16px 0 6px;font-weight:600}
        input,select{width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:7px;font-size:16px}
        button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:7px;background:#176b45;color:white;font-size:16px;font-weight:600}
        .message{padding:12px;background:#eef5ff;border-radius:7px;margin:12px 0;line-height:1.4}
        .back{display:block;text-align:center;margin-top:20px;color:#176b45;text-decoration:none}
    </style>
</head>
<body>
<div class="panel">
    <h2>Forgot Password?</h2>
    <p>Reset your {{ account_title }} account password using your registered email address.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('forgot_password', account_type=account_type) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="identifier">{{ identifier_label }}</label>
        <input id="identifier" name="identifier" required
               placeholder="{{ identifier_placeholder }}">

        <label for="email">Registered email address</label>
        <input id="email" name="email" type="email" required
               autocomplete="email" placeholder="Enter your registered email">

        <button type="submit">Request Password Reset</button>


    <a class="back" href="{{ back_url }}">Back to login</a>
</div>
</body>
</html>
